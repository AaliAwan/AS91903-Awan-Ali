<!DOCTYPE html>
<html lang="en">
<!-- This section links the menu page to the styles and normalise.css -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoops - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/normalise.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- This section gives the menu page a header, a logo, and links to all 3 website pages -->
    <header>
        <img src="images/logo.png" alt="Scoops Ice Cream Logo" class="logo">
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="menu.html" class="nav-link active">Menu</a>
            <a href="ordering.html" class="nav-link cta-link"><strong>Order Now</strong></a>
        </nav>
    </header>

    <!-- This section contains the content wrapper page which displays the ice cream flavors menu grid -->
    <main class="content-wrapper page-content menu-page">
        <section class="page-intro">
            <h1>Scoops Ice Cream Menu</h1>
            <p>Explore our delicious range of handcrafted artisan flavors made fresh daily with local ingredients.</p>
        </section>

        <!-- This section codes for the ice cream menu grid items using the gallery styling layout -->
        <section class="photo-grid">
            <figure class="gallery-item">
                <img src="images/vanilla_bean.jpg" alt="Classic Vanilla Bean Ice Cream" class="gallery-image">
                <figcaption>Classic Vanilla Bean - $4.50</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/chocolate_fudge.jpg" alt="Rich Chocolate Fudge Ice Cream" class="gallery-image">
                <figcaption>Rich Chocolate Fudge - $5.00</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/fresh_strawberry.jpg" alt="Fresh Strawberry Ice Cream" class="gallery-image">
                <figcaption>Fresh Strawberry - $4.50</figcaption>
            </figure>
            
            <figure class="gallery-item">
                <img src="images/mint_chip.jpg" alt="Mint Chocolate Chip Ice Cream" class="gallery-image">
                <figcaption>Mint Chocolate Chip - $5.00</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/cookies_cream.jpg" alt="Cookies & Cream Ice Cream" class="gallery-image">
                <figcaption>Cookies & Cream - $5.20</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/salted_caramel.jpg" alt="Salted Caramel Swirl Ice Cream" class="gallery-image">
                <figcaption>Salted Caramel Swirl - $5.20</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/mango_sorbet.jpg" alt="Vegan Mango Sorbet" class="gallery-image">
                <figcaption>Mango Sorbet (Vegan) - $4.80</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/waffle_sundae.jpg" alt="Signature Waffle Sundae" class="gallery-image">
                <figcaption>Signature Waffle Sundae - $7.50</figcaption>
            </figure>
        </section>
        
    </main>
    
    <!-- This is the footer with copyright information for Scoops -->
    <footer>
        <p>© Scoops Ice Cream Parlour 2026 - All Rights Reserved.</p>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</body>
</html>
