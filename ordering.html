<!DOCTYPE html>
<html lang="en">
<head>
<!-- Sets document encoding to standard UTF-8 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoops - Order Now</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<!-- Connects main CSS files for header and form layout -->
    <link rel="stylesheet" href="css/normalise.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- Fixed header with branding logo -->
    <!-- Header -->
    <header>
        <a href="index.html">
            <img src="images/logo.png" alt="Scoops Ice Cream Logo" class="logo">
        </a>
<!-- Navigation links bar -->
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="menu.html" class="nav-link">Menu</a>
            <a href="about.html" class="nav-link">About Us</a>
<!-- Active page highlight on Order Now button -->
            <a href="ordering.html" class="nav-link cta-link active"><strong>Order Now</strong></a>
        </nav>
    </header>

<!-- Main content container for form -->
    <!-- Content Wrapper -->
    <main class="content-wrapper page-content">
        <section class="page-intro">
            <h1>Place Your Pre-Order</h1>
            <p>Fill out the form below to order your favorite scoops ahead of time for quick pickup!</p>
        </section>

<!-- Google Form iframe section (Dominic's fix) -->
        <!-- Working Google Form Integration Container -->
        <section class="form-container">
            <!-- 
                Replace the src URL below with your actual published Google Form embed link:
                Go to Google Forms -> Send -> Embed HTML (<b>&lt;iframe&gt;</b>) -> Copy URL inside src=""
            -->
<!-- Google Form embedded iframe element -->
            <iframe 
                class="order-form-iframe" 
                src="https://docs.google.com/forms/d/e/1FAIpQLSc_EXAMPLE_FORM_ID/viewform?embedded=true" 
                width="100%" 
                height="800" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">
                Loading order form…
            </iframe>
        </section>
    </main>

<!-- Fixed footer banner -->
    <!-- Footer -->
    <footer>
        <p>© Scoops Ice Cream Parlour 2026 - All Rights Reserved.</p>
    </footer>
</body>
</html>
